<title>Chess Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{color-scheme:dark;--bg:#1f2430;--card:#2a3040;--ink:#e8ebf2;--mute:#9aa3b5;--light:#e9d9b8;--dark:#a67d52;--sel:#f6e05e;
--capture:#e5645c;--check:#f0a23b;--threat:#d98cf0;--fork:#ff7ab6;--discover:#b79cff;--defend:#5ac98f;--develop:#5aa9e6;--center:#8fd0d0;--castle:#9bb0ff;--promo:#ffd166;--mate:#ff4d4d;--warn:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
#mvin{flex:1;min-width:0}
#msg{min-height:1.2em;font-size:13px;color:var(--warn);margin-top:4px}
main{max-width:980px;margin:0 auto;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){main{grid-template-columns:minmax(0,460px) minmax(0,1fr);align-items:start}}
h1{font-size:18px;margin:0 0 4px}h2{font-size:14px;margin:0 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border-radius:12px;padding:12px}
#board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:8px;overflow:hidden;user-select:none;touch-action:manipulation}
.sq{position:relative;display:flex;align-items:center;justify-content:center;font-size:min(9vw,46px);cursor:pointer;line-height:1}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq .p{color:#000;text-shadow:0 0 2px #fff6}.sq .p.w{color:#fff;text-shadow:0 0 2px #000,0 0 1px #000}
.sq.sel{background:var(--sel)!important}.sq.hl{outline:3px solid var(--sel);outline-offset:-3px}
.sq .dot{position:absolute;width:30%;height:30%;border-radius:50%;background:#0006}
.sq .coord{position:absolute;left:2px;top:0;font-size:9px;color:#0008}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
button,select,textarea,input{font:inherit;color:var(--ink);background:#3a4258;border:0;border-radius:8px;padding:7px 11px}
button{cursor:pointer}button:active{background:#4a5470}
button.on{background:#566190}
textarea{width:100%;font-size:12px}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;margin:2px 4px 2px 0;color:#14171f;background:var(--c,#aab)}
.chip.warn{background:none;border:1px solid var(--warn);color:var(--warn)}
.k-capture{--c:var(--capture)}.k-check{--c:var(--check)}.k-threat{--c:var(--threat)}.k-fork{--c:var(--fork)}.k-discover{--c:var(--discover)}.k-defend{--c:var(--defend)}.k-develop{--c:var(--develop)}.k-center{--c:var(--center)}.k-castle{--c:var(--castle)}.k-promo{--c:var(--promo)}.k-mate{--c:var(--mate)}
.aw ul{margin:2px 0 8px;padding-left:18px}.aw li{margin:2px 0}.bad{color:var(--warn)}.good{color:var(--defend)}.mute{color:var(--mute)}
.mv{padding:6px 8px;border-radius:8px;cursor:pointer}.mv:hover,.mv.act{background:#363e54}
.mv b{display:inline-block;min-width:54px}
.grp{margin:8px 0 2px;color:var(--mute);font-size:12px;text-transform:uppercase}
.themes .chip{cursor:pointer;opacity:.9}.themes .chip.off{opacity:.35}
label{display:inline-flex;gap:6px;align-items:center}
details summary{cursor:pointer;color:var(--mute)}
</style>
<main>
 <section>
  <div class="card">
   <h1>♞ Chess Companion</h1>
   <div class="mute" style="font-size:13px;margin-bottom:8px">Shows what's possible &mdash; never what's best. Play both sides' moves on the board to track your game.</div>
   <div id="board"></div>
   <div id="status" style="margin-top:8px"></div>
   <form class="row" id="moveform" autocomplete="off"><input id="mvin" placeholder="Type a move: e4, Nf3, exd5, O-O" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"><button type="submit">Play</button></form>
   <div id="msg" role="status"></div>
   <div class="row">
    <button id="undo">↶ Undo</button><button id="flip">⇅ Flip</button><button id="new">New game</button>
   </div>
   <details style="margin-top:8px"><summary>Load / copy position (FEN)</summary>
    <textarea id="fen" rows="2"></textarea>
    <div class="row"><button id="loadfen">Load FEN</button></div>
   </details>
  </div>
 </section>
 <section style="display:grid;gap:12px">
  <div class="card">
   <h2>Settings</h2>
   <div class="row" style="margin-top:0">
    <label>Detail <select id="level"><option value="1">Awareness only</option><option value="2" selected>All moves + notes</option></select></label>
    <label><input type="checkbox" id="warn" checked> Blunder warnings</label>
   </div>
   <div class="mute" style="font-size:12px;margin-top:6px">Moves are listed by piece, never ranked. Turn warnings off for plain facts only.</div>
  </div>
  <div class="card aw" id="aware"></div>
  <div class="card" id="moves"></div>
 </section>
</main>
<script>/*SCRIPT*/</script>
